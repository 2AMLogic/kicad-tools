name: Nightly Bundle Drift Gate

# Issue #10692: compare every committed board bundle to a fresh run.
#
# `scripts/boards/refresh_bundles_6404.py --check` re-runs the whole refresh
# pipeline (refill, DRC, re-plot, ERC, kct check, re-pin) on the pinned KiCad
# toolchain with nothing published, anchored to each board's committed
# `checked_at`, and exits 1 when any bundle would publish a file. Every
# committed artifact is only ever compared to another committed artifact
# (hashes, manifest entries, `kct-check.json` vs `report.md`), so a bundle can
# be self-consistent and still disagree with what the current rules emit --
# Board 04's `pour_slot` count sat at 5 against a fresh 4 on the byte-identical
# PCB until someone regenerated by hand. On a bundle whose archive is current
# the refresh skips the checker, so `--check` additionally re-runs it and
# compares the per-rule violation counts (only those, not report bytes) with
# each committed check report, naming the stale report as drift.
#
# A board whose receipt is `blocked` (Board 04 until #10664 lands) also exits 1,
# reported as BLOCKED rather than drift (Issue #10662's verdict gate), so this
# job is expected red on main until that copper repair merges.
#
# Nightly and dispatch only, never a required per-PR check: the driver does a
# full ERC/DRC/replot per board, and a rule change must not fail unrelated
# PRs. Adding this job to the required status checks would be a separate
# repo-admin action; do not do it.

on:
  schedule:
    # 07:00 UTC daily -- after the 06:00 ship-ready survey, clear of the
    # 03:00/15:00 slow-tests runs this container setup shares.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: bundle-drift-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The digest stays single-sourced. ci.yml's workflow-level KICAD_IMAGE is
  # the one literal (#5682, docs/contributing/kicad-image-pin.md). A workflow
  # cannot read another workflow's env, so this bridge job reads the value out
  # of ci.yml at run time and republishes it into `needs` (`container.image`
  # cannot reference `env`; see ci.yml's kicad_pin).
  kicad_pin:
    name: KiCad image pin (read from ci.yml)
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false

      - name: Publish ci.yml's KICAD_IMAGE into the needs context
        id: pin
        run: |
          set -euo pipefail
          images=$(sed -n 's/^  KICAD_IMAGE: *//p' .github/workflows/ci.yml)
          if [ "$(printf '%s\n' "$images" | grep -c .)" != "1" ] \
            || ! printf '%s' "$images" | grep -qE '^kicad/kicad@sha256:[0-9a-f]{64}$'; then
            echo "::error::expected exactly one 'KICAD_IMAGE: kicad/kicad@sha256:<digest>' in ci.yml, found: ${images:-<none>}"
            exit 1
          fi
          echo "image=${images}" >> "$GITHUB_OUTPUT"

  bundle-drift:
    name: Committed bundles vs a fresh pinned run
    needs: [kicad_pin]
    runs-on: ubuntu-latest
    # Board 07's evidence stage runs real_design/build.py (routing), then each
    # board gets a refill, native DRC, ERC, re-plot and kct check. 90 min
    # matches the other board-07 jobs in slow-tests.yml.
    timeout-minutes: 90
    container:
      image: ${{ needs.kicad_pin.outputs.image }}
      # Root, so installs write system locations and actions/checkout can
      # write $GITHUB_WORKSPACE (mirrors ci.yml's Test job).
      options: --user 0:0
    defaults:
      run:
        # The image's /bin/sh is dash; force bash (mirrors ci.yml).
        shell: bash
    env:
      # Mirrors the board-07 recipe jobs in slow-tests.yml: the evidence stage
      # re-routes board 07, and str-hash order must not differ between runs.
      PYTHONHASHSEED: "42"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Ensure container has prerequisites
        # ca-certificates + curl for the uv installer; git for checkout;
        # cmake + build-essential for the C++ router backend build below.
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git cmake build-essential
          kicad-cli --version

      - uses: actions/checkout@v7

      - name: Trust the workspace for git
        # Root over a runner-owned checkout: git refuses it as "dubious
        # ownership" without this (mirrors ci.yml's Test job).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize stock KiCad libraries
        run: python3 scripts/ci/init_kicad_libraries.py

      - name: Install uv
        # Official one-liner instead of setup-uv: avoids action-host coupling
        # inside the container (mirrors ci.yml's Test job).
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Build native router extension
        # uv sync does NOT build the C++ router extension; without it board
        # 07's routing stage falls back to pure Python (10-100x slower).
        # --check makes a silent build failure fatal here.
        run: |
          uv run kct build-native
          uv run kct build-native --check

      - name: Check committed bundles against a fresh run
        # The board list is every key of the driver's BUNDLES; a test in
        # tests/test_refresh_bundles_6404.py keeps the two equal. --check
        # publishes nothing and exits 1 naming each drifted board and file.
        # pipefail propagates the driver's exit status through tee.
        run: |
          set -euo pipefail
          uv run python scripts/boards/refresh_bundles_6404.py \
            boards/04-stm32-devboard \
            boards/06-diffpair-test \
            boards/07-matchgroup-test \
            --check 2>&1 | tee bundle-drift.log

      - name: Verify the check published nothing
        # --check must leave the tree exactly as checked out, on success and
        # on drift alike.
        if: always()
        run: |
          set -euo pipefail
          dirty=$(git status --porcelain -- boards)
          if [ -n "$dirty" ]; then
            echo "::error::--check modified the tree instead of only listing drift:"
            echo "$dirty"
            exit 1
          fi
          echo "tree clean: --check published nothing"

      - name: Upload drift log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-drift-${{ github.run_id }}
          path: bundle-drift.log
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Board bundle drift gate"
            echo ""
            echo 'Verdict line (see the full log in the job output):'
            echo ""
            if [ -f bundle-drift.log ]; then
              echo '```'
              # The verdict block names every drifted board and its files.
              sed -n '/^== --check/,$p' bundle-drift.log || echo "(no --check verdict was reached)"
              echo '```'
            else
              echo "No drift log was produced -- see the job logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
