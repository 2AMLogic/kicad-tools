name: CI

# Main-branch runs (Issue #5986; 2AMLogic/2am docs/ci.md "Default-branch
# runs"): main is NOT verified on every merge any more. A PR already ran the
# suite on its own head, so main runs on a schedule against the NEWEST main
# commit and skips the merges in between (~20 merges/day x ~47 job-min each
# was ~935 job-min/day on main, most of it on the self-hosted `kicad` slots).
#   - hourly (minute 17 of every hour except 04): the full main verification,
#     skipped (every job, via the `kicad_pin` job's `skip` output) when the
#     newest main commit already has a successful non-PR CI run;
#   - nightly ("17 4 * * *", Issue #5743): the same full verification, never
#     skipped, so the from-scratch routing regressions run at least daily even
#     on a day with no merges;
#   - workflow_dispatch: an on-demand full verification, never skipped (the
#     daily release gate in scripts/release_plan.py dispatches one when the
#     SHA it gates has no main run yet).
#   - merge_group (Issue #9299): one run per GitHub merge-queue entry
#     (`checks_requested`), validating the COMBINED queue tree -- the queue
#     commit GitHub built from the queued PR(s) on top of main -- before the
#     queue may merge it. There is no PR to read on this event, so every
#     job's gate below treats it like a main verification run (`!= 'pull_request'`)
#     and runs the full suite unconditionally; `changes` path filtering stays
#     a pull_request-only gate. Runs only once the operator enables a merge
#     queue rule (a separate rollout step).
# Every non-`pull_request` event is therefore a "main verification run", and
# the job gates below test `github.event_name != 'pull_request'` (never
# `== 'push'`, which would now silently skip them). A break that only appears
# after merging is found up to one window later and may span several merges.
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 0-3,5-23 * * *"
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Single source of truth for every KiCad container this workflow runs (#5682).
# Docker Hub moved the floating kicad/kicad:10.0 tag from 10.0.5 to 10.0.6 on
# 2026-09-22 with no repo-visible signal, silently changing measured native
# behaviour and skipping every step after the native mask-to-copper gate
# (#5678). The digest below is the exact build kicad/kicad:10.0 resolved to
# when this pin landed (== 10.0.6), so pinning changes nothing today -- it
# only makes the *next* tag move a deliberate, reviewable PR. Bump procedure
# (native-gate re-qualification + QUALIFIED_NATIVE_VERSIONS update in the same
# change): docs/contributing/kicad-image-pin.md.
#
# Why an `env:` plus a bridge job rather than `${{ env.KICAD_IMAGE }}` at each
# `container.image`: GitHub does not allow the `env` context in
# jobs.<job_id>.container.image (only github/inputs/matrix/needs/strategy/vars
# -- "Unrecognized named-value: 'env'" otherwise), and this workflow is not a
# reusable workflow, so `inputs` is unavailable too. The `kicad_pin` job below
# republishes this one literal into the `needs` context the container jobs CAN
# reference, keeping the digest to this single line.
env:
  KICAD_IMAGE: kicad/kicad@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec

# One live run per ref (2AMLogic/2am#29, 2026-09-11). PR branches: a new push
# cancels the run it supersedes -- a third of the ~370 daily runs were
# superseded and still ran all 18 jobs to completion. main: a running
# verification is never cancelled, but GitHub keeps only the newest PENDING
# run per group, so main runs collapse to "one running, one waiting" (the
# waiting one replaced by a newer one) instead of a deep queue of stale main
# runs. Scheduled runs (hourly and nightly) share the `nightly` key; a
# workflow_dispatch run on main lands in the `ci` key. Since Issue #5986 main
# runs come from the schedule above, not from every merge.
#
# Merge-group runs (Issue #9299) are keyed by `github.sha` -- the queue
# commit, unique per queue entry -- and are never cancelled or superseded:
# each entry validates its own combined tree, and a PR push (a different
# group) cannot cancel a queue entry's started run. The PR/push/schedule
# groups are byte-identical to the pre-merge-queue template.
concurrency:
  group: ${{ github.event_name == 'merge_group' && format('ci-merge-group-{0}', github.sha) || format('ci-{0}-{1}-{2}', github.workflow, github.ref, github.event_name == 'schedule' && 'nightly' || 'ci') }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref != 'refs/heads/main' }}

jobs:
  # Bridge job (#5682): republishes the workflow-level KICAD_IMAGE env value
  # (the single digest source of truth above) into the `needs` context, since
  # `container.image` cannot reference the `env` context directly. Runs on
  # every event with no `if:` gate -- including main verification runs, where
  # the PR-only `changes` job below is skipped -- so the 12 container jobs
  # always resolve a non-empty image.
  #
  # It also publishes `skip` (Issue #5986): 'true' only on the HOURLY
  # schedule when the commit being verified (the newest main) already has a
  # successful non-PR CI run, so the hour exits after this job and the
  # cheap, unconditional `lint`. Every other job gates on
  # `needs.kicad_pin.outputs.skip != 'true'`. Never set on
  # pull_request, the nightly cron or workflow_dispatch. Fail-open: if the
  # lookup itself errors, `skip` stays 'false' and the full run proceeds.
  kicad_pin:
    name: KiCad image pin (env -> needs bridge)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      image: ${{ steps.pin.outputs.image }}
      skip: ${{ steps.green.outputs.skip || 'false' }}
    steps:
      - name: Publish KICAD_IMAGE into the needs context
        id: pin
        run: echo "image=${KICAD_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Skip the hourly run if newest main is already verified
        id: green
        if: github.event_name == 'schedule' && github.event.schedule != '17 4 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # A successful run of any non-pull_request event (an earlier hourly
          # run, the nightly, a dispatch) on this exact SHA already verified
          # it. PR runs never count: their head is not the merge commit and
          # they skip jobs through the `changes` filter.
          if n="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=100" \
                --jq "[.workflow_runs[] | select(.event != \"pull_request\" and .id != ${GITHUB_RUN_ID})] | length")"; then
            :
          else
            echo "::warning::could not query earlier CI runs; running the full suite (fail-open)"
            n=0
          fi
          if [ "${n:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Newest main ${GITHUB_SHA} already has ${n} successful CI run(s); skipping this hourly run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # Detect whether a PR touches anything CI can act on. 55 of the last 60 PRs
  # touched src/ or tests/ (measured 2026-09-11, 2AMLogic/2am#29), and every
  # board job legitimately depends on the router source, so this is NOT a
  # per-job path map -- it is a single "docs/site/agent-config only?" gate
  # that spares the ~8% of PRs which change only content the full
  # ~115 job-minutes. Main verification runs (schedule / workflow_dispatch)
  # always run everything. If detection itself fails, every job runs
  # (fail-open), so a broken filter can only cost minutes, never a false
  # green. Content contracts still run in lint.
  changes:
    name: Detect Changes
    # merge-group-audit: pr-only -- path groups gate PR runs only; merge_group
    # runs take the `!= 'pull_request'` branch of every dependent job's gate
    # and run the full suite on the combined tree (Issue #9299).
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      # Issue #9245: every output folds in "its step failed" (`outcome ==
      # 'failure'`) so a transient paths-filter/listFiles 5xx means
      # "assume changed" -- never an empty value that downstream
      # `== 'true'` conditions would read as "nothing changed" (a false
      # green that skips every job).
      code: ${{ steps.filter.outcome == 'failure' || steps.filter.outputs.code == 'true' }}
      board00: ${{ steps.shared.outcome == 'failure' || steps.shared.outputs.shared == 'true' || ((steps.filter.outcome == 'failure' || steps.filter.outputs.code == 'true') && (steps.boards.outcome == 'failure' || steps.boards.outputs.board00 == 'true')) }}
      board06: ${{ steps.shared.outcome == 'failure' || steps.shared.outputs.shared == 'true' || ((steps.filter.outcome == 'failure' || steps.filter.outputs.code == 'true') && (steps.boards.outcome == 'failure' || steps.boards.outputs.board06 == 'true')) }}
      board07: ${{ steps.shared.outcome == 'failure' || steps.shared.outputs.shared == 'true' || ((steps.filter.outcome == 'failure' || steps.filter.outputs.code == 'true') && (steps.boards.outcome == 'failure' || steps.boards.outputs.board07 == 'true')) }}
      test:
    name: Test
    needs: [changes, kicad_pin]
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || (github.event_name != 'pull_request' && needs.kicad_pin.outputs.skip != 'true') || needs.changes.outputs.code == 'true' || needs.changes.result == 'failure') }}
    # GitHub-hosted for every event (Issue #6013). It used to run on a
    # self-hosted runner for main pushes and same-repo PRs, where it took
    # ~30 min; on ubuntu-latest every step runs ~2.2x slower (#5747), so the
    # full bulk pool could not fit. The fix is to run less here, not to run
    # it on bigger hardware: tests listed in tests/ci_extended.txt (>= 3 s
    # each in a measured run, ~72% of the bulk pool's test-time) carry the
    # `ci_extended` marker, are deselected below, and run in the
    # "Test (extended)" job on main verification runs (hourly/nightly
    # schedule and workflow_dispatch, #5986).
    runs-on: ubuntu-latest
    env:
      # Pin -n auto's worker count at GitHub-hosted parity (4 vCPU) so memory
      # stays bounded (the self-hosted container is not CPU-pinned and would
      # otherwise see every host core).
      PYTEST_XDIST_AUTO_NUM_WORKERS: "4"
      # Issue #5501: bound the number of native KiCad processes across the
      # whole job.
      #
      # Attribution (PR #5503's observer, run 35099894489, re-derived with
      # scripts/ci/analyze_native_observations.py): the bulk pool launched 857
      # native processes -- all attributed to an owning test and worker --
      # spread across 50+ modules, so isolating modules cannot fix it. Sampled
      # peak RSS was 2.31 GiB median / 2.66 GiB max; the pool reached 4-way
      # native overlap and drove memory.current and memory.peak to the full
      # 12 GiB with 209 memory.events.max events. 15% of those launches came
      # from a descendant process rather than the worker itself, which is why
      # the gate installs in kicad_tools/__init__.py as well as conftest.
      #
      # Original choice of 1 (#5501/#5524): the CONSTRAINT_MEMCG kill recorded
      # for PR #5499 had three concurrent natives (2.36 + 2.36 + 1.66 =
      # 6.38 GiB). A bound of 1 caps native anon at 2.66 GiB, 3.7 GiB below
      # that. Measured cost at the time (--simulate-bound, same run): +257 s on
      # the bulk group, longest single slot wait 4.8 s, worst single test
      # +23.1 s -- this is the regression #5616 (+19.4% Test job median,
      # +26.6% Run-tests step median) pinned to this bound.
      #
      # Revised to 2 (Issue #5616): re-running --simulate-bound 1/2/3/4
      # against the same archived run 35099894489 evidence shows the added
      # wall time drops steeply and non-linearly with one extra slot: bound=1
      # +257 s, bound=2 +12 s (worst single test +2.0 s, longest wait 1.4 s),
      # bound=3 +1 s, bound=4 ~0 s (the run's own observed max concurrency).
      # Memory-wise, bound=3 or 4 would let native anon reach 3x/4x 2.66 GiB
      # (7.98/10.64 GiB) -- at or above the two only concrete distress points
      # on record (the 6.38 GiB #5499 oom_kill and this run's own ~7.0 GiB
      # 209-event ceiling-pressure moment), i.e. exactly the magnitude that
      # has already produced one confirmed cgroup kill. Bound=2 caps native
      # anon at 2 x 2.66 GiB = 5.32 GiB and, just as importantly, makes the
      # specific 3-way overlap that produced the #5499 kill structurally
      # impossible (never more than 2 native processes can hold a slot at
      # once) -- so it recovers ~95% of the added wall time (257 s -> 12 s)
      # while remaining strictly below both known distress configurations.
      # Sampled RSS is a lower bound and is never treated as cgroup usage;
      # the cgroup counters are audited separately by the step below, and
      # this PR opts diagnostics on so that audit runs against a live bound=2
      # job before merge.
      #
      # #5624 (merged the same day as this change, after the #5616
      # measurement window closed) independently excludes `kicad-cli
      # --help`/`--version` capability probes from ever taking a permit --
      # those were previously ~2 of every 3 permit acquisitions in the common
      # post-route fill path (#5603) and inflated queue contention for the
      # real, board-loading launches this gate actually protects against.
      # That fix and this bound increase are additive, not alternatives: the
      # post-merge remeasurement this issue's acceptance criteria call for
      # should be read against a cohort that has both.
      #
      # Nothing here alters the memory limit, worker count, selections or
      # assertions.
      #
      # Issue #5572 -- the one thing that estimate got wrong. Waiting for a
      # slot is wall-clock time inside the waiting test, and pytest-timeout
      # charged it to that test's budget, so a test's effective deadline became
      # its own work plus a queue wait for a shared resource. The ">30 s
      # already has an override" audit above did not cover the tests that sat
      # just under it, and marking the observed offenders (#5556/#5573) only
      # moved the failure to the next-heaviest native-using test.
      #
      # Decision (option 1 of #5572): the gate now gives the measured wait back
      # to the armed pytest-timeout deadline instead of raising --timeout for
      # every test in the job (option 2) or chasing the next offender with
      # another marker (option 3). The tradeoff is explicit: a blanket raise
      # would have multiplied hang-detection latency -- the reason the cap is
      # 60 s at all (#2794) -- across ~8000 tests that never queue, whereas the
      # credit is paid only by tests that actually waited, is exactly the
      # measured wait, and is capped per test by
      # KCT_NATIVE_SLOT_CREDIT_SECONDS (default 120 s). Worst-case detection
      # latency for a hung test is therefore bounded at 60 s + 120 s, the same
      # ceiling option 2 would have set globally, and the deadline still
      # measures the test's own work. Subprocess timeouts are untouched.
      # Issue #6716: the credit is applied DURING the wait (before every poll
      # sleep), not once a permit arrives -- crediting afterwards let SIGALRM
      # fire inside the queue wait, killing tests that were merely queued.
      # See src/kicad_tools/native_concurrency.py "Timeout credit".
      KCT_NATIVE_MAX_CONCURRENCY: "2"
      # Explicit diagnostic opt-in only. KCT_NATIVE_DIAGNOSTICS is set by the
      # "Resolve native diagnostics opt-in" step below (Issue #9120), not here:
      # a job-level contains() on the PR body is an unanchored substring test,
      # so a PR that merely quoted the marker in prose opted itself in.
      KCT_OBSERVER_PR_HEAD: ${{ github.event.pull_request.head.sha }}
    # Issue #5747/#6013/#5768: one hosted runner, so one budget. Measured
    # 2026-10-10 over the 25 most recent successful PR `Test` jobs (workflow
    # runs 37873727836..38095351857; reproduce with `gh run list --workflow
    # ci.yml --event pull_request --status success` then `gh run view <run>
    # --json jobs`): end to end min 31m22s, median 53m37s, p90 55m30s, max
    # 56m41s (16 of 25 took over 50 min; the fast ones are a bimodal tail,
    # not a target). Newest five (run/job): 38095351857/114340019801 55m30s,
    # 38083225866/114304283760 54m56s, 38080252788/114295530259 32m30s,
    # 38071430743/114269508068 53m52s, 38013132377/114097451692 54m01s.
    # `Run tests` was 21m13s-38m29s of that across those five.
    #
    # Re-measured 2026-10-18 (Issue #7327; job started_at..completed_at):
    # PR runs 2026-10-17 max 68.3m (n=6), PR runs 2026-10-18 median 55.6m /
    # max 74.3m (n=8, run 39159276578), main runs 2026-10-18 median 66.2m /
    # max 71.6m (n=8). `Run tests` was 28.8-57.0m. The worst case now sits
    # ~1% under the limit, so the old ~33% headroom is gone. This is a dated
    # snapshot, not a budget: re-measure before relying on it.
    #
    # A run killed by the timeout is absent from a success-only cohort, so
    # the real tail is longer than measured, and a killed run leaves no
    # pytest summary. The final "Report job time budget" step warns at 80%
    # of the limit (and writes the slowest tests to the step summary) so
    # creep shows up on the PR that causes it.
    #
    # Raised 75 -> 120 on 2026-10-20 as a STOPGAP (operator ruling Q28 = 1 on
    # #5240): runs were being cancelled at ~1h15m in `Run tests` with zero
    # failures (e.g. run 39384875895, 39404353472), forcing hour-long
    # re-runs on every PR. Sharding/streamlining the job is still the real
    # fix and stays open on #5240; do not treat 120 as headroom to spend.
    # Keep TIMEOUT_MINUTES in "Report job time budget" equal to this value
    # (tests/test_ci_native_observer_workflow.py enforces it). A hung test is
    # bounded by pytest's own --timeout=60 long before this fires; this
    # ceiling only guards a whole-job stall.
    timeout-minutes: 120
    # Issue #3436: run inside the official KiCad 10 container (same image
    # as the kicad-cli-smoke job; see its comment for why apt+PPA installs
    # are NOT used). The container provides what dozens of tests need and
    # the bare runner lacks:
    # - /usr/share/kicad/symbols + /usr/share/kicad/footprints at KiCad 10
    #   (ubuntu noble's kicad-symbols/kicad-footprints universe packages
    #   are KiCad-7-era: no Device:Q_NMOS, different LM393 unit structure,
    #   stale footprint pad definitions -- ~40 test failures/errors)
    # - kicad-cli 10 for the DRC/ERC-backed tests (board-02 baseline's
    #   "DRC PASSED" parsing, pipeline ERC/zones steps)
    # All of these failures were previously invisible because the Test
    # step had continue-on-error.
    container:
      image: ${{ needs.kicad_pin.outputs.image }}
      # On the runner this is a sibling container of the runner's own, created by
      # the host daemon, so the slot's cpuset/memory do not apply to it. CPU is
      # deliberately NOT pinned: a hardcoded --cpuset-cpus breaks every heavy
      # job whenever the host is resized (#5694), and contention is left to the
      # scheduler -- if the host overloads, that is signal to resize it. Memory
      # IS capped, so one runaway job cannot OOM the whole host: 12g (6 GB
      # SIGKILLed kicad-cli under four xdist workers, 2026-09-11; a
      # GitHub-hosted VM has 16 GB).
      # GitHub-hosted runs get the plain --user 0:0 (nothing to contain). Root
      # either way, so installs write system locations and actions/checkout can
      # write $GITHUB_WORKSPACE (mirrors the smoke job).
      # The 12 GiB cap stays on hosted (a 16 GB VM): the native-concurrency
      # bound and the workload audit are calibrated against this cgroup
      # (#5501, #5616).
      options: --user 0:0 --memory 12g
    defaults:
      run:
        # The image's /bin/sh is dash; force bash (mirrors the smoke job).
        shell: bash
    steps:
      - name: Record job start time
        # Issue #7327: input for the final "Report job time budget" step.
        run: echo "KCT_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Ensure container has prerequisites
        # ca-certificates/curl/git for checkout + uv bootstrap; cmake and
        # build-essential for the C++ router backend build below; nodejs for
        # executing workflow JavaScript regression tests.
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git cmake build-essential nodejs jq
          kicad-cli --version

      - name: Install pinned actionlint
        # Issue #8098: tests/install/test_install_kct.py
        # ::test_upgrade_workflow_passes_actionlint lints the vendored
        # kct-upgrade workflow and skipped here because actionlint was not
        # on PATH. Pinned version + committed sha256 (same curl pattern as
        # uv; no third-party setup action inside the container). A failed
        # download or checksum fails the job; KCT_REQUIRE_ACTIONLINT (set on
        # "Run tests") turns a missing binary into a test failure, not a skip.
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          dir="$(mktemp -d)"
          curl -fsSL -o "$dir/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" actionlint
          install -m 0755 "$dir/actionlint" /usr/local/bin/actionlint
          actionlint -version

      - uses: actions/checkout@v7
        with:
          # Full history + tags: the release repo-introspection tests
          # (`*_against_this_repo`) need a reachable v* tag, which a default
          # shallow, tagless checkout does not provide (they would skip).
          fetch-depth: 0
          fetch-tags: true

      - name: Trust the workspace for git
        # The job runs as root (--user 0:0) over a checkout owned by the
        # runner's uid, so git refuses the repo ("dubious ownership") and the
        # repo-introspecting release tests (test_release_plan/test_release_tag
        # `*_against_this_repo`) could only skip. actions/checkout's own
        # safe.directory entry lives in a temporary HOME and is removed
        # afterwards, so persist one for the rest of the job.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve native diagnostics opt-in
        # Issue #9120: opt in only when the PR body carries the
        # `kct:native-diagnostics` comment alone on its own line (outside a
        # code fence). The body is read from the event JSON by the script,
        # never interpolated into shell or retained; only true/false is
        # written to GITHUB_ENV. Pushes and absent markers stay inert.
        run: echo "KCT_NATIVE_DIAGNOSTICS=true" >> "$GITHUB_ENV"

      - name: Initialize stock KiCad libraries
        run: python3 scripts/ci/init_kicad_libraries.py

      - name: Install uv
        # Official one-liner instead of setup-uv: avoids action-host
        # coupling inside the container (mirrors the smoke job).
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        # Pin the interpreter via uv (parity with the other jobs that use
        # actions/setup-python with python-version: "3.12"); the container
        # image's own Python version is irrelevant.
        run: uv sync --frozen --extra dev --python 3.12

      - name: Run tests
        # Issue #3436: continue-on-error was removed from this step. It
        # made the job green regardless of pytest's exit code, hiding 162
        # failures + 30 errors on main (run 27235563106) and rendering CI,
        # Judges, and the merge queue blind to test regressions. This step
        # now gates: if it is red, fix the tests -- do NOT re-add
        # continue-on-error. Known-broken tests must be xfail'd with a
        # tracking issue instead.
        # Issue #9340: the bulk selection (including the dedicated-module
        # ignores and the BOARD_07 conditional) lives in one script the local
        # gate also runs (2am#7561 ruling); this step adds the CI-only
        # native-observer wrapper, the repository-variable env and the
        # junit.xml artifact path.
        env:
          KCT_OBSERVER_CONTAINER_ID: ${{ job.container.id }}
          BOARD_07_CI_ENABLED: ${{ vars.BOARD_07_CI_ENABLED }}
          # Issue #8098: the actionlint test fails instead of skipping here.
          KCT_REQUIRE_ACTIONLINT: "1"
        run: |
          python3 scripts/ci/run_observed.py bulk -- bash scripts/ci/jobs/test.sh bulk -p tests.board06_replay \
            --junitxml "$RUNNER_TEMP/junit/bulk.xml"

      - name: Retain test timings
        # Input for scripts/ci/update_ci_extended.py (Issue #6013).
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-bulk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit native workload observations
        # Issue #5501: when the observations exist, assert what they show --
        # no cgroup OOM/OOM-kill event, no gate fallback to an unbounded
        # launch, and no group exceeding KCT_NATIVE_MAX_CONCURRENCY. Run
        # against the retained pre-fix baseline this fails on the bulk group
        # (observed native concurrency 4), so a green result here is evidence
        # rather than a lucky retry. Additive gate: it can only add failures.
        #
        # STATED TOLERANCE (Issue #9120): --tolerance-seconds 1 lets native
        # concurrency spend up to 1 s above the bound, so a green here is
        # "no OOM, no unbounded launch, and at most 1 s above the bound", not
        # "never above it". Measured on run 44026950753 (bulk, 2041.6 s):
        # 0.272 s at 3 processes, from a kicad-cli started by a `bash -c` gate
        # block of tests/test_signoff_skill_e2e.py -- the flock gate wraps
        # Python's subprocess.Popen only, so a shell-launched kicad-cli is
        # outside it (gate unbounded_launches was 0). The run's separate
        # "permit concurrency 3" figure was a log-ordering artifact, fixed in
        # native_concurrency._Permit.release. Anything longer, any OOM and any
        # unbounded launch still fails.
        if: ${{ always() && env.KCT_NATIVE_DIAGNOSTICS == 'true' }}
        run: |
          python3 scripts/ci/analyze_native_observations.py "$RUNNER_TEMP/native-observer" \
            --max-concurrency "$KCT_NATIVE_MAX_CONCURRENCY" \
            --tolerance-seconds 1 \
            --simulate-bound 1 --simulate-bound 2 --simulate-bound 4 \
            --json "$RUNNER_TEMP/native-observer/attribution.json"

      - name: Retain native workload observations
        if: ${{ always() && env.KCT_NATIVE_DIAGNOSTICS == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-workload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-observer/
          if-no-files-found: warn
          retention-days: 7

      - name: Report job time budget
        # Issue #7327: report-only (never fails). Warns past 80% of
        # timeout-minutes so creep is visible before a bare timeout kill.
        if: ${{ always() }}
        env:
          TIMEOUT_MINUTES: "120"
        run: |
          now=$(date +%s)
          start="${KCT_JOB_START:-$now}"
          used_min=$(( (now - start) / 60 ))
          limit_min="$TIMEOUT_MINUTES"
          threshold=$(( limit_min * 80 / 100 ))
          {
            echo "### Test job time budget"
            echo ""
            echo "Elapsed: ${used_min} of ${limit_min} min (warn at ${threshold} min)"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( used_min >= threshold )); then
            echo "::warning::Test job used ${used_min} of ${limit_min} min (over 80% of timeout-minutes); see #5240 for sharding"
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import os, glob
          import xml.etree.ElementTree as ET
          rows = []
          for f in glob.glob(os.path.join(os.environ.get("RUNNER_TEMP", "."), "junit", "*.xml")):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  rows.append((float(tc.get("time") or 0), tc.get("classname", ""), tc.get("name", "")))
          rows.sort(reverse=True)
          if rows:
              print("\n#### Slowest 15 tests (bulk junit)\n")
              print("| seconds | test |\n|---|---|")
              for t, c, n in rows[:15]:
                  print(f"| {t:.1f} | `{c}.{n}` |")
          PY


